name: lukami-runner
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
concurrency:
  group: lukami-runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.60.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: run pending jobs
        env:
          FW_COOKIES_JSON: ${{ secrets.FW_COOKIES_JSON }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
        run: python cloud_runner.py
